name: ProGrad
description: >-
  ProGrad (prograd.uk) is a UK-based consumer mobile app that lets users earn
  money by playing games and completing online tasks such as surveys and offers,
  positioning itself as a leading "make money" app in the United Kingdom. Users
  choose from a large catalogue of games and micro-tasks, accumulate rewards, and
  withdraw earnings to PayPal or Visa once they pass a minimum threshold. The
  company also publishes Gen Z insights and research alongside a consumer blog.
  Surfaced as a Techstars portfolio company and added to the API Evangelist
  network, ProGrad is a consumer-facing product with no public developer program,
  API portal, or programmatic surface at this time.
